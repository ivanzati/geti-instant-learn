name: Cleanup Docs Preview Pages

on:
  pull_request:
    types:
      - closed

concurrency:
  group: preview-pages-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup-preview:
    name: Remove PR preview pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: gh-pages

      - name: Remove preview directory for closed PR
        shell: bash
        run: |
          rm -rf "pr-${{ github.event.pull_request.number }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: clean docs preview for pr-${{ github.event.pull_request.number }}"
            git push
          fi
